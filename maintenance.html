<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance — DEVSHREE Hardware & Tools</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284C7'><circle cx='12' cy='12' r='10'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="in-maintenance-mode">
  <div id="maintenance-mount"></div>

  <script type="module">
    import { 
      getMaintenanceConfig, 
      fetchRemoteMaintenanceConfig, 
      generateMaintenanceHtml, 
      injectMaintenanceStyles 
    } from './assets/js/maintenance.js?v=2.7.0';

    injectMaintenanceStyles();

    // Check preview parameter in URL
    const urlParams = new URLSearchParams(window.location.search);
    const isPreview = urlParams.get('preview') === '1';

    let config = getMaintenanceConfig();
    document.getElementById('maintenance-mount').innerHTML = generateMaintenanceHtml(config);

    if (!isPreview) {
      // Periodically check if site is brought back online
      setInterval(async () => {
        try {
          const fresh = await fetchRemoteMaintenanceConfig();
          if (fresh && fresh.enabled === false) {
            window.location.href = 'index.html';
          }
        } catch (_) {}
      }, 15000);
    }
  </script>
</body>
</html>
